openapi: 3.1.0
info:
  title: Restaurant Reception Agent API
  version: 0.1.0
  description: |
    REST interface for starting an identified customer session and continuing a
    multi-turn conversation with the Restaurant Reception Agent. This API is a
    separate application and treats the provided Restaurant Reservation API at
    http://localhost:8000 as an upstream black box.
servers:
  - url: http://localhost:8080
paths:
  /:
    get:
      operationId: testUi
      summary: Open the local browser test interface
      responses:
        "200":
          description: Single-page HTML test client
          content:
            text/html:
              schema:
                type: string
  /health:
    get:
      operationId: health
      summary: Check agent service liveness
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/sessions:
    post:
      operationId: startSession
      summary: Identify a customer and start a conversation session
      description: |
        Looks up the customer by phone or email. If no match exists, name is
        required and a new customer is created in the upstream backend. When
        both phone and email are supplied they must identify the same customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions/{session_id}/messages:
    post:
      operationId: sendMessage
      summary: Process one customer turn
      description: |
        Runs the bounded LangGraph workflow using SQLite-checkpointed session
        history and durable customer memory. A message also resumes any pending
        customer-confirmation interrupt for this session. `client_message_id`
        makes retries idempotent within a session. Verbose mode returns safe
        decision and tool audit events, never private chain-of-thought, prompts,
        credentials, or raw upstream errors.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "200":
          description: Turn completed, including customer-action failures that the agent explains naturally
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/sessions/{session_id}/messages/stream:
    post:
      operationId: streamMessage
      summary: Stream one customer turn using Server-Sent Events
      description: |
        Runs the same idempotent LangGraph turn as the JSON endpoint and streams
        privacy-safe progress plus assistant text. The client uses fetch streaming
        because EventSource cannot send the required POST body.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "200":
          description: SSE stream containing status, delta, complete, error, and heartbeat frames
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  parameters:
    SessionId:
      in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    CustomerIdentity:
      type: object
      additionalProperties: false
      properties:
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 120
        phone:
          type: [string, "null"]
          minLength: 3
          maxLength: 32
        email:
          type: [string, "null"]
          format: email
          maxLength: 254
      anyOf:
        - required: [phone]
        - required: [email]
    StartSessionRequest:
      type: object
      additionalProperties: false
      required: [customer]
      properties:
        customer:
          $ref: "#/components/schemas/CustomerIdentity"
    SessionCustomer:
      type: object
      additionalProperties: false
      required: [id, name, is_new]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        is_new:
          type: boolean
    SessionResponse:
      type: object
      additionalProperties: false
      required: [session_id, customer, created_at]
      properties:
        session_id:
          type: string
          format: uuid
        customer:
          $ref: "#/components/schemas/SessionCustomer"
        created_at:
          type: string
          format: date-time
    MessageRequest:
      type: object
      description: >-
        One conversational turn. Booking details may be supplied across turns; the agent
        retains partial facts and will not check availability or create a reservation until
        party size, exact restaurant-local date/time, and seating (indoor, outdoor, or an
        explicit no-preference choice) are resolved.
      additionalProperties: false
      required: [client_message_id, message]
      properties:
        client_message_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Caller-generated idempotency key scoped to the session.
        message:
          type: string
          minLength: 1
          maxLength: 4000
        verbose:
          type: boolean
          default: false
    ToolAuditEvent:
      type: object
      additionalProperties: false
      required: [sequence, event_type, status]
      properties:
        sequence:
          type: integer
          minimum: 1
        event_type:
          type: string
          enum: [decision, tool_call, tool_result]
        summary:
          type: [string, "null"]
          description: Safe outcome summary; excludes hidden reasoning and sensitive data.
        tool_name:
          type: [string, "null"]
        status:
          type: string
          enum: [planned, succeeded, failed, skipped]
        duration_ms:
          type: [integer, "null"]
          minimum: 0
    Usage:
      type: object
      additionalProperties: false
      required: [input_tokens, output_tokens, total_tokens]
      properties:
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    MessageResponse:
      type: object
      additionalProperties: false
      required: [session_id, client_message_id, message, status, trace_id]
      properties:
        session_id:
          type: string
          format: uuid
        client_message_id:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [completed, needs_input, failed]
        trace_id:
          type: string
          format: uuid
        audit_events:
          type: array
          items:
            $ref: "#/components/schemas/ToolAuditEvent"
          description: Empty unless verbose was requested and enabled.
        usage:
          anyOf:
            - $ref: "#/components/schemas/Usage"
            - type: "null"
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, trace_id]
          properties:
            code:
              type: string
            message:
              type: string
            trace_id:
              type: string
              format: uuid
            retryable:
              type: boolean
              default: false
  responses:
    NotFound:
      description: Session or resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Identity conflict or duplicate message payload mismatch
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Per-user/session request or token budget exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamError:
      description: The Restaurant Reservation API returned an unusable response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: LLM provider or required upstream service unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
